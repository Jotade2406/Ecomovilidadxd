services:

  # ── Bases de datos ─────────────────────────────────────────
  postgres-db:
    image: postgres:15
    container_name: ecomovilidad-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: ecomovilidad
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres-databases.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ecomovilidad"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-db:
    image: mongo:7
    container_name: ecomovilidad-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Microservicio IAM (roles y permisos) ───────────────────
  iam-service:
    build:
      context: .
      dockerfile: iam-service/Dockerfile
    container_name: ecomovilidad-iam
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/iam_service
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_FLYWAY_DEFAULT_SCHEMA: public
      SPRING_FLYWAY_CREATE_SCHEMAS: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres-db:
        condition: service_healthy

  # ── Microservicio AI (generación de credenciales con IA) ───
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: ecomovilidad-ai
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      AI_DB_HOST: postgres-db
      AI_DB_PORT: 5432
      AI_DB_NAME: ai_service
      AI_DB_USER: root
      AI_DB_PASSWORD: 123456
    depends_on:
      postgres-db:
        condition: service_healthy

  # ── Backend Java Spring Boot ────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: ecomovilidad-backend-java/Dockerfile
    container_name: ecomovilidad-backend
    ports:
      - "5034:5034"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/ecomovilidad
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_MONGODB_URI: mongodb://mongo-db:27017
      SPRING_DATA_MONGODB_DATABASE: ecomovilidad_evidencias
      AI_SERVICE_URL: http://ai-service:8091
      IAM_SERVICE_URL: http://iam-service:8080
    depends_on:
      postgres-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
      ai-service:
        condition: service_started
      iam-service:
        condition: service_started

  # ── Frontend Next.js ────────────────────────────────────────
  frontend:
    build:
      context: ./ecomovilidad-frontend
      dockerfile: Dockerfile
    container_name: ecomovilidad-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
